name: OpenAPI Spec Check

# Fails when docs/public/openapi/openapi.json doesn't match what the backend
# generates. Fix by running `npm run openapi:generate` in backend/ and
# committing the result.
on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/public/openapi/**"
      - ".github/workflows/openapi-check.yml"
  workflow_dispatch:

concurrency:
  group: openapi-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-up-to-date:
    name: OpenAPI spec is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs Nest in preview mode, so no database or Redis service is needed.
      - name: Generate OpenAPI spec
        run: npm run openapi:generate

      - name: Check committed spec matches
        run: |
          if ! git diff --exit-code -- ../docs/public/openapi/openapi.json; then
            echo "::error file=docs/public/openapi/openapi.json::openapi.json is out of date. Run 'npm run openapi:generate' in backend/ and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- ../docs/public/openapi/openapi.json)" ]; then
            echo "::error file=docs/public/openapi/openapi.json::openapi.json is not committed. Run 'npm run openapi:generate' in backend/ and commit the result."
            exit 1
          fi
