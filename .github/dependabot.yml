# Dependabot configuration for Dharini project
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Keeps the number of pull requests (and the CI runs they start) small:
#   - monthly, one pull request per folder for minor and patch updates
#   - no automatic rebase when staging moves; comment "@dependabot rebase" on a
#     pull request when you want one
#   - major versions are left out; update those by hand
# Security updates are not affected by the schedule: they open as soon as an
# advisory is published.

version: 2
updates:
  # ===================
  # WEB (Next.js Frontend)
  # ===================
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Kolkata"
    target-branch: "staging"
    reviewers:
      - "dsih-artpark/dharini"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(web)"

  # ===================
  # BACKEND (NestJS)
  # ===================
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Kolkata"
    target-branch: "staging"
    reviewers:
      - "dsih-artpark/dharini"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(backend)"

