  # ===================

  # ===================
  # GitHub Actions (third-party actions are pinned to commit SHAs)
  # ===================
  # Minor and patch updates come as one pull request. A major version of an
  # action gets its own pull request: these sit in the publish and deploy path,
  # which the pull request checks do not run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Kolkata"
    target-branch: "staging"
    reviewers:
      - "dsih-artpark/dharini"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
